name: Update values

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-values
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Sync card catalog from demongacha.com
        env:
          CATALOG_BASE: https://r.jina.ai/https://demongacha.com
        run: node scripts/sync-cards.mjs

      - name: Import the community value sheet
        run: node scripts/import-sheet.mjs

      - name: Commit if the data changed
        run: |
          if git diff --quiet -- data/cards.json data/anchors.json data/meta.json; then
            echo "No data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cards.json data/anchors.json data/meta.json data/audit.json data/sheet-source.csv
          git commit -m "Update card values and demand"
          git push
